name: Test Lesson Scripts

on:
  pull_request:
    paths:
      - 'lessons/**'
      - '!lessons/**/*.md'
  workflow_dispatch: 

# Cancel in-progress runs when new commits are pushed to the same PR
concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: Fast validation to catch shell script issues before running expensive E2E tests
  validate:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck on lesson scripts
        run: |
          echo "Running shellcheck on all .sh files in lessons/"
          find lessons -name "*.sh" -type f -exec echo "Checking {}" \; -exec shellcheck {} \;

      - name: Verify required scripts exist and are executable
        run: |
          echo "Verifying required scripts..."

          # Check that critical scripts exist
          required_files=(
            "lessons/00-setup/smoke-test.sh"
            "lessons/00-setup/setup.sh"
            "lessons/00-setup/teardown.sh"
            "lessons/00-setup/common.sh"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi
            echo "✓ Found: $file"
          done

          # Verify executable scripts are executable
          executable_files=(
            "lessons/00-setup/smoke-test.sh"
            "lessons/00-setup/setup.sh"
            "lessons/00-setup/teardown.sh"
          )

          for file in "${executable_files[@]}"; do
            if [[ ! -x "$file" ]]; then
              echo "ERROR: File is not executable: $file"
              exit 1
            fi
            echo "✓ Executable: $file"
          done

          echo "All required scripts validated successfully!"

  # Job 2: Full E2E smoke test with isolated KinD cluster
  smoke-test:
    name: E2E Smoke Test
    runs-on: ubuntu-latest
    needs: validate  
    timeout-minutes: 35  # Total workflow timeout with buffer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git operations in tests

      - name: Free disk space
        run: |
          echo "Freeing up disk space for KinD cluster and container images..."

          # Remove large packages to prevent disk exhaustion
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          # Clean up Docker to free space
          docker system prune -af

          df -h

      - name: Install kind
        run: |
          KIND_VERSION="v0.23.0"
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          kind version

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'  # Matches tutorial Kubernetes version

      - name: Verify kubectl installation
        run: kubectl version --client

      - name: Verify Docker is running
        run: |
          echo "Verifying Docker daemon is available..."
          docker info
          echo "Docker is ready!"

      - name: Run smoke test with cluster creation
        id: smoke-test
        timeout-minutes: 30  # Step-level timeout with buffer beyond expected 15-20 min
        run: |
          echo "Starting smoke test with --create-cluster mode..."
          echo "This will create a KinD cluster, run all lesson tests, and tear down."
          echo "Expected runtime: 15-20 minutes"
          echo ""

          cd lessons/00-setup
          ./smoke-test.sh --create-cluster

      - name: Cleanup kind cluster
        if: always() && steps.smoke-test.outcome != 'skipped'
        run: |
          echo "Ensuring kind cluster is deleted..."
          kind delete cluster --name gitops-tutorial || true
          echo "Cleanup complete!"
